name: frontend
on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
      - name: Smoke standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          PORT=3000 HOSTNAME=0.0.0.0 node .next/standalone/server.js &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:3000/en && break; sleep 1; done
          for want in /:200 /en:200 /xx:404; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000${want%%:*}")
            echo "${want%%:*} -> $code"
            [ "$code" = "${want##*:}" ] || exit 1
          done
      - name: Smoke loopback HOSTNAME is refused at boot
        run: |
          rc=0
          HOSTNAME=127.0.0.1 PORT=3001 timeout 20 node .next/standalone/server.js > guard.log 2>&1 || rc=$?
          cat guard.log
          [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] || { echo "server did not exit non-zero (rc=$rc)"; exit 1; }
          grep -q "HOSTNAME=127.0.0.1 makes every default-locale page redirect" guard.log
      - run: pnpm test
