[project]
name = "bumbli-e2e"
version = "0.1.0"
description = "Browser end-to-end suite: real Next.js build, real FastAPI backend, real Postgres, test-model agent."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "playwright==1.58.0",
    "pytest>=9.2.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -p harness"

[tool.ty.environment]
# launcher.py runs in the backend venv: let ty resolve its imports there too
extra-paths = ["../backend", "../backend/.venv/lib/python3.13/site-packages"]
